# GKE. Used through the generated overlay in .local/gcp/overlay (scripts/gcp/04-deploy.sh),
# which adds the Artifact Registry image names:
#   images: [{name: parcs8/daemon, newName: <region>-docker.pkg.dev/<project>/parcs/daemon, newTag: <tag>}, ...]
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
patches:
  # job storage: RWX volume from the NFS-Ganesha provisioner (storage class created by its
  # Helm chart, see scripts/gcp/04-deploy.sh and deploy/gcp/nfs-values.yaml)
  # The claim must fit inside the NFS server's own disk (20Gi in nfs-values.yaml, ~19.5Gi
  # usable after the filesystem), otherwise the provisioner refuses with "insufficient
  # available space". Datasets + outputs need ~2-3 GB.
  - target: {kind: PersistentVolumeClaim, name: parcs-storage}
    patch: |-
      - {op: add, path: /spec/storageClassName, value: parcs-rwx}
      - {op: replace, path: /spec/resources/requests/storage, value: 10Gi}
