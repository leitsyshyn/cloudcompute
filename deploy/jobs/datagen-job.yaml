# Generates the benchmark datasets inside the cluster, on the shared job storage, with
# scripts/datagen.py (byte-identical to the RPP generator):
#   kubectl create configmap datagen --from-file=scripts/datagen.py
#   kubectl apply -f deploy/jobs/datagen-job.yaml
# The args line lists the datasets (profile:size_mb); scripts/gcp/05-datasets.sh may replace it.
apiVersion: batch/v1
kind: Job
metadata:
  name: datagen
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      # on a worker: the master node's CPU is fully requested by host/portal/db/NFS. The job
      # runs once, before any measurement, while the daemons are idle.
      nodeSelector: {parcs-role: worker}
      containers:
        - name: datagen
          image: python:3.12-slim
          command: ["python", "-I", "/scripts/datagen.py", "--out-dir", "/var/lib/storage/datasets",
                    "--edge-cases", "--skip-existing"]
          args: ["natural:10", "lowcard:10", "highcard:10", "boundary:10", "natural:100", "natural:500", "natural:1000", "highcard:100"]
          resources:
            requests: {cpu: 250m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
          volumeMounts:
            - {name: storage, mountPath: /var/lib/storage}
            - {name: scripts, mountPath: /scripts}
      volumes:
        - name: storage
          persistentVolumeClaim: {claimName: parcs-storage}
        - name: scripts
          configMap: {name: datagen}
